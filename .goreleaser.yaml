version: 2

project_name: made

before:
  hooks:
    - go mod tidy
    # Shell completion scripts, shipped in the archives and installed by the cask.
    # zsh looks completions up by function name, hence _made.
    - sh -c 'mkdir -p completions && go run . completion bash > completions/made.bash && go run . completion zsh > completions/_made && go run . completion fish > completions/made.fish'

builds:
  - id: made
    main: .
    binary: made
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: made
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - completions/*

sboms:
  - artifacts: archive
    # Inventory the files actually shipped; do not enrich them from online sources.
    args:
      - "${artifact}"
      - --output
      - "spdx-json=${document}"
    env:
      - SYFT_CHECK_FOR_APP_UPDATE=false
      - SYFT_FILE_METADATA_CATALOGER_ENABLED=true

checksum:
  name_template: checksums.txt

signs:
  - cmd: sh
    # GoReleaser v2 only warns if a signer writes no file. The wrapper requires
    # a nonempty bundle before the pipeline reaches Homebrew or release uploads.
    args:
      - scripts/sign-checksums.sh
      - "${artifact}"
      - "${signature}"
    artifacts: checksum
    signature: "${artifact}.sigstore.json"

changelog:
  sort: asc
  filters:
    exclude:
      # Conventional types left out of the notes, with or without a scope or "!".
      - "^(docs|test|ci)(\\(.*\\))?!?:"

homebrew_casks:
  - name: made
    repository:
      owner: Tarektouati
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/Tarektouati/made"
    description: "Markdown-driven task runner — tasks are H3 headings + fenced code blocks"
    binaries:
      - made
    completions:
      bash: completions/made.bash
      zsh: completions/_made
      fish: completions/made.fish
    hooks:
      post:
        # The binary is unsigned, so strip the Gatekeeper quarantine attribute on
        # macOS; otherwise the first run is blocked. (Proper signing/notarization
        # would be the alternative.)
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/made"]
          end
