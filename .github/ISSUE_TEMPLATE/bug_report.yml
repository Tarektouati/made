name: Bug report
description: Report unexpected behavior in made.
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, use [private vulnerability reporting](https://github.com/Tarektouati/made/security/advisories/new) instead of a public issue.
        Please check existing issues before reporting the same problem.
  - type: input
    id: version
    attributes:
      label: made version
      description: Paste the output of made --version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, installation method, and the task's interpreter/version if relevant.
      placeholder: macOS arm64, Homebrew, bash 5.3
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command and a small Madefile that reproduces the problem. Remove secrets and private paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the output and exit code, if available.
    validations:
      required: true
