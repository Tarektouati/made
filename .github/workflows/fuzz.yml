name: Fuzz

on:
  schedule:
    - cron: "37 6 * * 1" # Mondays 06:37 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: ./internal/parser, target: FuzzParse }
          - { package: ./internal/parser, target: FuzzValidateNesting }
          - { package: ./internal/selfupdate, target: FuzzNormalizeTag }
          - { package: ./internal/selfupdate, target: FuzzChecksumFor }
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
      - name: Install pinned Go and made
        run: |
          proto install go
          proto install made
      - name: Fuzz for 30 seconds
        run: made test-pkg -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 30s -parallel 2 -timeout 2m ${{ matrix.package }}
      - name: Save failing corpus
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: internal/**/testdata/fuzz/**
          if-no-files-found: ignore
