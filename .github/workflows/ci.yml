name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20 # a lost runner otherwise burns ~45 min
    strategy:
      fail-fast: false
      matrix:
        # -race needs cgo + a C compiler; skip it on Windows where the
        # hosted runner has no compiler reliably on PATH. The code has no
        # concurrency, so this only trades a slower detector run for safety.
        include:
          - { os: ubuntu-latest, race: "-race" }
          - { os: macos-latest, race: "-race" }
          - { os: windows-latest, race: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install fish
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y fish
          else brew install fish; fi
      - name: Run tests
        if: runner.os == 'Windows'
        run: go test -v ${{ matrix.race }} -count=1 ./...
      # On unix, run one step per package. When the macOS runner dies, its log
      # is lost, but the jobs API still records step names and status, so we
      # can see which package killed it. Each step runs in its own session
      # (setsid), so a signal sent to a session or process group can't reach
      # Runner.Worker.
      - name: Test ./internal/runner
        if: runner.os != 'Windows'
        timeout-minutes: 8
        run: perl -MPOSIX -e 'POSIX::setsid() or die "setsid failed " . $!; exec @ARGV' go test -v ${{ matrix.race }} -count=1 -timeout 5m ./internal/runner
      - name: Test ./e2e
        if: runner.os != 'Windows'
        timeout-minutes: 8
        run: perl -MPOSIX -e 'POSIX::setsid() or die "setsid failed " . $!; exec @ARGV' go test -v ${{ matrix.race }} -count=1 -timeout 5m ./e2e
      - name: Test . (root)
        if: runner.os != 'Windows'
        timeout-minutes: 8
        run: perl -MPOSIX -e 'POSIX::setsid() or die "setsid failed " . $!; exec @ARGV' go test -v ${{ matrix.race }} -count=1 -timeout 5m .
      - name: Test ./internal/parser ./internal/completion
        if: runner.os != 'Windows'
        timeout-minutes: 8
        run: perl -MPOSIX -e 'POSIX::setsid() or die "setsid failed " . $!; exec @ARGV' go test -v ${{ matrix.race }} -count=1 -timeout 5m ./internal/parser ./internal/completion

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=${{ matrix.goos == 'windows' && '.exe' || '' }}
          go build -trimpath -ldflags="-s -w" -o "dist/made-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" .
      - uses: actions/upload-artifact@v7
        with:
          name: made-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  # Compares the PR against its base on this one runner. Warn only: nothing here
  # fails the job. Run it locally with scripts/bench.sh (see CONTRIBUTING.md).
  bench:
    name: Bench (base vs head)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency: # one run per PR, so two pushes can't each create the sticky comment
      group: bench-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write # sticky comment; absent on fork PRs, where it is skipped
    env:
      HYPERFINE_VERSION: "2.0.0"
      HYPERFINE_SHA256: ae2beda2ac99c098427e4f755244552daf20e514422889cca6d44421e2d93c87
      BENCHSTAT_VERSION: v0.0.0-20261009192801-be2c69fb417e
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the base commit must be available
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install hyperfine and benchstat (pinned)
        continue-on-error: true # warn only
        run: |
          tarball="hyperfine-v${HYPERFINE_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/sharkdp/hyperfine/releases/download/v${HYPERFINE_VERSION}/$tarball"
          echo "$HYPERFINE_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/${tarball%.tar.gz}/hyperfine" /usr/local/bin/hyperfine
          go install "golang.org/x/perf/cmd/benchstat@${BENCHSTAT_VERSION}"
      - name: Run benchmarks
        continue-on-error: true # warn only
        run: scripts/bench.sh "${{ github.event.pull_request.base.sha }}" "$RUNNER_TEMP/bench"
      - name: Publish report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          report="$RUNNER_TEMP/bench/report.md"
          # -s, not -f: bench.sh tees into report.md, so a failed run can leave it empty.
          if [ ! -s "$report" ]; then
            mkdir -p "$(dirname "$report")"
            printf '## made benchmarks: base vs head\n\n⚠️ The benchmark run failed; see the job log.\n' > "$report"
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            scripts/bench-comment.sh "$report"
          else
            echo "Fork PR: skipping the PR comment, see the step summary."
          fi
