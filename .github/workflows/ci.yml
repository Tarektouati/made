name: CI

# Every action is pinned to a full commit SHA, with its release in a trailing
# comment. Dependabot (.github/dependabot.yml) bumps the SHA and the comment
# together. Checkouts set persist-credentials: false: no step pushes or fetches
# with git (the bench comment authenticates gh with GH_TOKEN instead).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so new advisories in the vulnerability database show up without a push.
  # Only the vulncheck job runs on it: lint and test skip scheduled runs, and build
  # needs them, so it is skipped too (bench is pull_request only).
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch: # manual run of lint, test, vulncheck and build (bench is pull_request only)

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fail when a workflow uses an action by tag or branch instead of a full
      # commit SHA (local ./ actions excepted), so a new step can't skip the pin.
      - name: Check actions are pinned to commit SHAs
        run: |
          if grep -rnP '^\s*-?\s*uses:\s*(?!\./)[^@\s]+@(?![0-9a-f]{40}\b)' .github/workflows; then
            echo "::error::pin every uses: above to a full 40-character commit SHA with a # vX.Y.Z comment"
            exit 1
          fi
      # Toolchain versions are pinned in .prototools; CI runs the same
      # `made lint` task as local development and no-mistakes.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
      - name: Install go, golangci-lint and made
        run: proto install
      - name: Run golangci-lint
        run: made lint

  test:
    name: Test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20 # a lost runner otherwise burns ~45 min
    strategy:
      fail-fast: false
      matrix:
        # -race needs cgo + a C compiler, which the hosted Windows runner does
        # not reliably have on PATH, so Windows runs without it. The concurrent
        # code (signal handling, the parse timeout, task teardown) still runs
        # under the detector on Linux and macOS.
        # require lists the interpreters whose tests must run: a missing one fails the
        # job instead of skipping them (MADE_TEST_REQUIRE, see internal/testenv).
        include:
          - { os: ubuntu-latest, race: "-race", require: "bash sh zsh fish python3 node ruby perl" }
          - { os: macos-latest, race: "-race", require: "bash sh zsh fish python3 node ruby perl" }
          - { os: windows-latest, race: "", require: "bash sh python3 node ruby perl" }
    env:
      MADE_TEST_REQUIRE: ${{ matrix.require }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Toolchain versions are pinned in .prototools.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
      - name: Install Go
        run: proto install go
      - name: Install made
        if: runner.os != 'Windows'
        run: proto install made
      - name: Install fish and zsh
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y fish zsh
          else brew install fish; fi # macOS ships zsh
      # Windows runs go test directly, not made test: made has no Windows release
      # (.goreleaser.yaml builds linux and darwin) and tools/proto/made.toml has no
      # Windows platform, so proto cannot install the pinned made here. Once it can,
      # note that made runs the first bash in an absolute PATH entry: on this image
      # C:\Program Files\Git\bin (Git Bash) comes before the WSL launcher in
      # C:\Windows\System32.
      - name: Run tests
        if: runner.os == 'Windows'
        run: go test -v ${{ matrix.race }} -count=1 ./...
      # On unix, run one step per package. When the macOS runner dies, its log
      # is lost, but the jobs API still records step names and status, so we
      # can see which package killed it. Each step runs the Madefile's test-pkg
      # task with the made pinned in .prototools, in its own session (setsid),
      # so a signal sent to a session or process group can't reach
      # Runner.Worker. !cancelled() runs every package step even after one
      # fails, so a failure in one package does not hide the others' results.
      # Every package from `go list ./...` must be in exactly one step below, and
      # each step's name must list its packages: e2e TestCIUnixStepsCoverAllPackages
      # fails otherwise.
      - name: Test ./internal/runner
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        timeout-minutes: 8
        run: perl -MPOSIX -e 'POSIX::setsid() or die "setsid failed " . $!; exec @ARGV' made test-pkg -v ${{ matrix.race }} -count=1 -timeout 5m ./internal/runner
      - name: Test ./e2e
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        timeout-minutes: 8
        run: perl -MPOSIX -e 'POSIX::setsid() or die "setsid failed " . $!; exec @ARGV' made test-pkg -v ${{ matrix.race }} -count=1 -timeout 5m ./e2e
      # The runner image makes /usr/local/bin world-writable (chmod -R 777 in
      # actions/runner-images install-nodejs.sh), so the install.sh default-dir tests
      # skip in the step above. Clear its group and other write bits for this step
      # only (owner untouched, mode restored on exit), so nobody, which is never its
      # owner, cannot write it. Run the tests as nobody from a copy it owns (modules
      # downloaded beforehand, no network), and fail if they skip or do not run.
      - name: Test install.sh default dir as nobody
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        timeout-minutes: 8
        run: |
          set -o pipefail
          sandbox=$(mktemp -d)
          log="$RUNNER_TEMP/install-default-dir.log"
          # proto keeps Go under the runner's home, which nobody may not be able
          # to read, so give the sandbox its own copy of the toolchain.
          cp -R "$(go env GOROOT)" "$sandbox/goroot"
          gobin="$sandbox/goroot/bin"
          cp -R . "$sandbox/src"
          mkdir "$sandbox/home" "$sandbox/tmp"
          (cd "$sandbox/src" && GOMODCACHE="$sandbox/mod" GOFLAGS=-modcacherw go mod download)
          sudo chown -R nobody: "$sandbox"
          stat -c '/usr/local/bin: owner %U:%G mode %a' /usr/local/bin
          mode=$(stat -c '%a' /usr/local/bin)
          trap 'sudo chmod "$mode" /usr/local/bin' EXIT
          sudo chmod go-w /usr/local/bin
          if sudo -u nobody test -w /usr/local/bin; then
            echo "::error::/usr/local/bin is still writable for nobody"
            exit 1
          fi
          (cd / && sudo -u nobody -- sh -c '
            cd "$1/src" &&
            HOME="$1/home" TMPDIR="$1/tmp" GOCACHE="$1/cache" GOPATH="$1/gopath" \
              GOMODCACHE="$1/mod" GOPROXY=off GOTOOLCHAIN=local GOFLAGS=-mod=readonly \
              PATH="$2:/usr/bin:/bin" \
              exec go test -count=1 ./e2e -run "TestInstallScript(Sudo|DefaultDir)" -v
          ' sh "$sandbox" "$gobin") 2>&1 | tee "$log"
          if grep -q -- '--- SKIP' "$log"; then
            echo "::error::install.sh default-dir tests skipped as nobody"
            exit 1
          fi
          for test in TestInstallScriptSudo TestInstallScriptDefaultDir; do
            grep -q -- "--- PASS: $test " "$log" || { echo "::error::$test did not pass as nobody"; exit 1; }
          done
      - name: Test . (root)
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        timeout-minutes: 8
        run: perl -MPOSIX -e 'POSIX::setsid() or die "setsid failed " . $!; exec @ARGV' made test-pkg -v ${{ matrix.race }} -count=1 -timeout 5m .
      - name: Test ./internal/parser ./internal/completion ./internal/lint ./internal/testenv ./internal/selfupdate ./internal/updatecheck ./internal/task
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        timeout-minutes: 8
        run: perl -MPOSIX -e 'POSIX::setsid() or die "setsid failed " . $!; exec @ARGV' made test-pkg -v ${{ matrix.race }} -count=1 -timeout 5m ./internal/parser ./internal/completion ./internal/lint ./internal/testenv ./internal/selfupdate ./internal/updatecheck ./internal/task

  # govulncheck for each build-matrix target through the Madefile's vulncheck
  # task, with the Go pinned in .prototools. Also runs on the weekly schedule.
  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Toolchain versions are pinned in .prototools.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
      - name: Install Go and made
        run: |
          proto install go
          proto install made
      - name: Run govulncheck
        run: made vulncheck

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Toolchain versions are pinned in .prototools.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
      - name: Install Go and made
        run: |
          proto install go
          proto install made
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: made dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: made-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  # Compares the PR against its base on this one runner. Warn only: nothing here
  # fails the job. Run it locally with made bench (see CONTRIBUTING.md).
  bench:
    name: Bench (base vs head)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency: # one run per PR, so two pushes can't each create the sticky comment
      group: bench-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write # sticky comment; absent on fork PRs, where it is skipped
    env:
      HYPERFINE_VERSION: "2.0.0"
      HYPERFINE_SHA256: ae2beda2ac99c098427e4f755244552daf20e514422889cca6d44421e2d93c87
      BENCHSTAT_VERSION: v0.0.0-20261009192801-be2c69fb417e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base commit must be available
          persist-credentials: false
      # Toolchain versions are pinned in .prototools.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
      - name: Install Go
        # setup-go used to put GOPATH/bin on PATH; benchstat is go-installed there.
        run: |
          proto install go
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install made
        continue-on-error: true # warn only
        run: proto install made
      - name: Install hyperfine and benchstat (pinned)
        continue-on-error: true # warn only
        run: |
          tarball="hyperfine-v${HYPERFINE_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/sharkdp/hyperfine/releases/download/v${HYPERFINE_VERSION}/$tarball"
          echo "$HYPERFINE_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/${tarball%.tar.gz}/hyperfine" /usr/local/bin/hyperfine
          go install "golang.org/x/perf/cmd/benchstat@${BENCHSTAT_VERSION}"
      - name: Run benchmarks
        continue-on-error: true # warn only
        run: made bench "${{ github.event.pull_request.base.sha }}" "$RUNNER_TEMP/bench"
      - name: Publish report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          report="$RUNNER_TEMP/bench/report.md"
          # -s, not -f: bench.sh tees into report.md, so a failed run can leave it empty.
          if [ ! -s "$report" ]; then
            mkdir -p "$(dirname "$report")"
            printf '## made benchmarks: base vs head\n\n⚠️ The benchmark run failed; see the job log.\n' > "$report"
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            scripts/bench-comment.sh "$report"
          else
            echo "Fork PR: skipping the PR comment, see the step summary."
          fi
